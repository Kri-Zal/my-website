<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free Online JSON Formatter & Validator - Format, validate, and beautify JSON data instantly.">
  <title>JSON Formatter & Validator - Format JSON Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #0f0f1e 0%, #1a0033 50%, #0f0f1e 100%);
      font-family: 'Space Grotesk', sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 15px 20px;
      background: rgba(0, 255, 255, 0.05);
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 255, 0.1);
    }
    
    .logo {
      font-size: 1.5rem;
      color: #00ffff;
      text-decoration: none;
      font-weight: 700;
    }
    
    .logo:hover {
      color: #00d4ff;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .header h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #00ffff, #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    
    .header p {
      color: #a0d4ff;
      font-size: 1.1rem;
    }
    
    .tools-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .editor-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 255, 0.15);
      border-radius: 12px;
      padding: 15px;
    }
    
    .editor-label {
      font-size: 0.9rem;
      color: #00ffff;
      margin-bottom: 10px;
      display: block;
      font-weight: 600;
    }
    
    textarea {
      width: 100%;
      height: 300px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 8px;
      color: #00ffff;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      padding: 15px;
      resize: vertical;
    }
    
    textarea:focus {
      outline: none;
      border-color: #00ffff;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
    }
    
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #00ffff, #00d4ff);
      color: #0f0f1e;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.9rem;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 255, 255, 0.3);
    }
    
    .btn-secondary {
      background: rgba(0, 255, 255, 0.2);
      color: #00ffff;
      border: 1px solid rgba(0, 255, 255, 0.3);
    }
    
    .message {
      padding: 10px 15px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 0.85rem;
    }
    
    .message.success {
      background: rgba(0, 255, 0, 0.1);
      color: #00ff00;
      border: 1px solid rgba(0, 255, 0, 0.2);
    }
    
    .message.error {
      background: rgba(255, 0, 0, 0.1);
      color: #ff6b6b;
      border: 1px solid rgba(255, 0, 0, 0.2);
    }
    
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 40px;
    }
    
    .feature {
      padding: 15px;
      background: rgba(0, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 255, 0.1);
      border-radius: 8px;
      text-align: center;
    }
    
    .feature-icon {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    
    .feature-title {
      color: #00ffff;
      font-weight: 600;
      margin-bottom: 5px;
    }
    
    @media (max-width: 768px) {
      .tools-grid {
        grid-template-columns: 1fr;
      }
      
      .header h1 {
        font-size: 1.8rem;
      }
      
      textarea {
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="index.html" class="logo">← Back Home</a>
      <div style="color: #00ffff; font-weight: 600;">JSON Formatter</div>
    </div>
    
    <div class="header">
      <h1>📋 JSON Formatter & Validator</h1>
      <p>Format, validate, and beautify your JSON data instantly</p>
    </div>
    
    <div class="tools-grid">
      <div class="editor-box">
        <label class="editor-label">📥 Input JSON</label>
        <textarea id="inputJSON" placeholder="Paste your JSON here..."></textarea>
        <div class="buttons">
          <button class="btn" onclick="formatJSON()">✨ Format</button>
          <button class="btn btn-secondary" onclick="minifyJSON()">📦 Minify</button>
          <button class="btn btn-secondary" onclick="validateJSON()">✓ Validate</button>
        </div>
        <div id="inputMessage"></div>
      </div>
      
      <div class="editor-box">
        <label class="editor-label">📤 Output JSON</label>
        <textarea id="outputJSON" placeholder="Formatted output will appear here..." readonly></textarea>
        <div class="buttons">
          <button class="btn" onclick="copyToClipboard('outputJSON')">📋 Copy</button>
          <button class="btn btn-secondary" onclick="downloadJSON()">⬇️ Download</button>
          <button class="btn btn-secondary" onclick="clearAll()">🗑️ Clear</button>
        </div>
      </div>
    </div>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon">✨</div>
        <div class="feature-title">Format</div>
        <p style="font-size: 0.9rem; color: #a0d4ff;">Beautiful indentation</p>
      </div>
      <div class="feature">
        <div class="feature-icon">✓</div>
        <div class="feature-title">Validate</div>
        <p style="font-size: 0.9rem; color: #a0d4ff;">Check syntax</p>
      </div>
      <div class="feature">
        <div class="feature-icon">📦</div>
        <div class="feature-title">Minify</div>
        <p style="font-size: 0.9rem; color: #a0d4ff;">Remove whitespace</p>
      </div>
      <div class="feature">
        <div class="feature-icon">📋</div>
        <div class="feature-title">Copy</div>
        <p style="font-size: 0.9rem; color: #a0d4ff;">One-click copy</p>
      </div>
    </div>
  </div>
  
  <script>
    function formatJSON() {
      try {
        const input = document.getElementById('inputJSON').value;
        const parsed = JSON.parse(input);
        const formatted = JSON.stringify(parsed, null, 2);
        document.getElementById('outputJSON').value = formatted;
        showMessage('inputMessage', 'Valid JSON formatted successfully!', 'success');
      } catch (e) {
        showMessage('inputMessage', 'Invalid JSON: ' + e.message, 'error');
      }
    }
    
    function minifyJSON() {
      try {
        const input = document.getElementById('inputJSON').value;
        const parsed = JSON.parse(input);
        const minified = JSON.stringify(parsed);
        document.getElementById('outputJSON').value = minified;
        showMessage('inputMessage', 'JSON minified successfully!', 'success');
      } catch (e) {
        showMessage('inputMessage', 'Invalid JSON: ' + e.message, 'error');
      }
    }
    
    function validateJSON() {
      try {
        const input = document.getElementById('inputJSON').value;
        JSON.parse(input);
        showMessage('inputMessage', '✓ Valid JSON!', 'success');
      } catch (e) {
        showMessage('inputMessage', '✗ Invalid JSON: ' + e.message, 'error');
      }
    }
    
    function copyToClipboard(elementId) {
      const text = document.getElementById(elementId).value;
      navigator.clipboard.writeText(text).then(() => {
        alert('Copied to clipboard!');
      });
    }
    
    function downloadJSON() {
      const text = document.getElementById('outputJSON').value;
      if (!text) return alert('Nothing to download');
      const element = document.createElement('a');
      element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
      element.setAttribute('download', 'data.json');
      element.click();
    }
    
    function showMessage(elementId, message, type) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.className = 'message ' + type;
      setTimeout(() => el.textContent = '', 3000);
    }
    
    function clearAll() {
      document.getElementById('inputJSON').value = '';
      document.getElementById('outputJSON').value = '';
    }
  </script>
</body>
</html>
