<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free Markdown to HTML Converter - Convert and preview Markdown instantly with live preview.">
  <title>Markdown to HTML Converter - Preview Markdown Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #0f0f1e 0%, #1a0033 50%, #0f0f1e 100%);
      font-family: 'Space Grotesk', sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 15px 20px;
      background: rgba(0, 255, 255, 0.05);
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 255, 0.1);
    }
    
    .logo {
      font-size: 1.5rem;
      color: #00ffff;
      text-decoration: none;
      font-weight: 700;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .header h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #00ffff, #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    
    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .editor-section {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
    }
    
    .section-title {
      color: #00ffff;
      font-weight: 600;
      margin-bottom: 15px;
      font-size: 0.95rem;
    }
    
    textarea {
      width: 100%;
      height: 400px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 8px;
      color: #00ffff;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      padding: 15px;
      resize: vertical;
    }
    
    textarea:focus {
      outline: none;
      border-color: #00ffff;
    }
    
    .preview {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 8px;
      padding: 20px;
      height: 400px;
      overflow-y: auto;
      color: #e0e0e0;
      line-height: 1.6;
    }
    
    .preview h1, .preview h2, .preview h3 {
      color: #00ffff;
      margin: 15px 0 10px 0;
    }
    
    .preview h1 { font-size: 1.8rem; }
    .preview h2 { font-size: 1.5rem; }
    .preview h3 { font-size: 1.2rem; }
    
    .preview p { margin: 10px 0; }
    .preview code {
      background: rgba(0, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Fira Code', monospace;
      color: #00ffff;
    }
    
    .preview pre {
      background: rgba(0, 0, 0, 0.5);
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 10px 0;
    }
    
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    
    .btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #00ffff, #00d4ff);
      color: #0f0f1e;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.9rem;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 255, 255, 0.3);
    }
    
    @media (max-width: 768px) {
      .editor-grid {
        grid-template-columns: 1fr;
      }
      
      textarea, .preview {
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="index.html" class="logo">← Back Home</a>
      <div style="color: #00ffff; font-weight: 600;">Markdown Converter</div>
    </div>
    
    <div class="header">
      <h1>📝 Markdown to HTML Converter</h1>
      <p style="color: #a0d4ff;">Convert and preview Markdown instantly</p>
    </div>
    
    <div class="editor-grid">
      <div class="editor-section">
        <div class="section-title">📥 Markdown Input</div>
        <textarea id="markdown" placeholder="# Hello\n\nEnter your **markdown** here..." onkeyup="convertMarkdown()"></textarea>
        <div class="buttons">
          <button class="btn" onclick="copyPreview()">📋 Copy HTML</button>
          <button class="btn" onclick="clearMarkdown()">🗑️ Clear</button>
        </div>
      </div>
      
      <div class="editor-section">
        <div class="section-title">👁️ Preview</div>
        <div class="preview" id="preview"></div>
      </div>
    </div>
  </div>
  
  <script>
    function convertMarkdown() {
      const md = document.getElementById('markdown').value;
      let html = md
        .replace(/^### (.+?)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+?)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+?)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>')
        .replace(/^- (.+?)$/gm, '<li>$1</li>')
        .split('\n').map((line, i) => {
          if (!line.startsWith('<')) line = '<p>' + line + '</p>';
          return line;
        }).join('');
      
      document.getElementById('preview').innerHTML = html;
    }
    
    function copyPreview() {
      const html = document.getElementById('preview').innerHTML;
      navigator.clipboard.writeText(html);
      alert('HTML copied!');
    }
    
    function clearMarkdown() {
      document.getElementById('markdown').value = '';
      document.getElementById('preview').innerHTML = '';
    }
  </script>
</body>
</html>
