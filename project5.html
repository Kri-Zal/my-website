<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free Text Statistics & Analytics Tool - Analyze word count, character count, reading time and more.">
  <title>Text Statistics & Analytics - Word Counter & Character Counter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #0f0f1e 0%, #1a0033 50%, #0f0f1e 100%);
      font-family: 'Space Grotesk', sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 15px 20px;
      background: rgba(0, 255, 255, 0.05);
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 255, 0.1);
    }
    
    .logo {
      font-size: 1.5rem;
      color: #00ffff;
      text-decoration: none;
      font-weight: 700;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .header h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #00ffff, #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    
    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    
    .editor-box {
      grid-column: 1 / 3;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
    }
    
    .label {
      color: #00ffff;
      font-weight: 600;
      margin-bottom: 10px;
      display: block;
    }
    
    textarea {
      width: 100%;
      height: 250px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 8px;
      color: #00ffff;
      font-size: 1rem;
      padding: 15px;
      resize: vertical;
      font-family: inherit;
    }
    
    textarea:focus {
      outline: none;
      border-color: #00ffff;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      grid-column: 1 / 3;
    }
    
    .stat-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 2.5rem;
      color: #00ffff;
      font-weight: 700;
      margin-bottom: 5px;
    }
    
    .stat-label {
      color: #a0d4ff;
      font-size: 0.9rem;
    }
    
    .button-group {
      grid-column: 1 / 3;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    
    .btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #00ffff, #00d4ff);
      color: #0f0f1e;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 255, 255, 0.3);
    }
    
    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }
      
      .editor-box, .stats-grid, .button-group {
        grid-column: 1 !important;
      }
      
      .header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="index.html" class="logo">← Back Home</a>
      <div style="color: #00ffff; font-weight: 600;">Text Analytics</div>
    </div>
    
    <div class="header">
      <h1>📊 Text Statistics & Analytics</h1>
      <p style="color: #a0d4ff;">Analyze your text instantly</p>
    </div>
    
    <div class="content">
      <div class="editor-box">
        <label class="label">📝 Paste Your Text</label>
        <textarea id="textInput" placeholder="Paste your text here..." oninput="updateStats()"></textarea>
      </div>
      
      <div class="stat-box">
        <div class="stat-value" id="charCount">0</div>
        <div class="stat-label">Characters</div>
      </div>
      
      <div class="stat-box">
        <div class="stat-value" id="wordCount">0</div>
        <div class="stat-label">Words</div>
      </div>
      
      <div class="stat-box">
        <div class="stat-value" id="lineCount">0</div>
        <div class="stat-label">Lines</div>
      </div>
      
      <div class="stat-box">
        <div class="stat-value" id="readTime">0m</div>
        <div class="stat-label">Read Time</div>
      </div>
      
      <div class="button-group">
        <button class="btn" onclick="clearText()">🗑️ Clear</button>
        <button class="btn" onclick="copyText()">📋 Copy</button>
      </div>
    </div>
  </div>
  
  <script>
    function updateStats() {
      const text = document.getElementById('textInput').value;
      
      const charCount = text.length;
      const wordCount = text.trim() ? text.trim().split(/\s+/).length : 0;
      const lineCount = text ? text.split('\n').length : 0;
      const readTime = Math.ceil(wordCount / 200);
      
      document.getElementById('charCount').textContent = charCount;
      document.getElementById('wordCount').textContent = wordCount;
      document.getElementById('lineCount').textContent = lineCount;
      document.getElementById('readTime').textContent = readTime + 'm';
    }
    
    function clearText() {
      document.getElementById('textInput').value = '';
      updateStats();
    }
    
    function copyText() {
      document.getElementById('textInput').select();
      document.execCommand('copy');
      alert('Text copied!');
    }
  </script>
</body>
</html>
