<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free QR Code Generator - Create and download QR codes instantly for URLs, text, and more.">
  <title>QR Code Generator - Create QR Codes Free Online</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode.js/1.5.3/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #0f0f1e 0%, #1a0033 50%, #0f0f1e 100%);
      font-family: 'Space Grotesk', sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 15px 20px;
      background: rgba(0, 255, 255, 0.05);
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 255, 0.1);
    }
    
    .logo {
      font-size: 1.5rem;
      color: #00ffff;
      text-decoration: none;
      font-weight: 700;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .header h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #00ffff, #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    
    .generator-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 255, 0.15);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
    }
    
    .input-group {
      margin-bottom: 25px;
    }
    
    .label {
      color: #00ffff;
      font-weight: 600;
      margin-bottom: 10px;
      display: block;
    }
    
    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 6px;
      color: #00ffff;
      font-size: 1rem;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: #00ffff;
    }
    
    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    
    .btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #00ffff, #00d4ff);
      color: #0f0f1e;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.9rem;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 255, 255, 0.3);
    }
    
    #qrcodeContainer {
      background: white;
      padding: 20px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 20px;
    }
    
    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="index.html" class="logo">← Back Home</a>
      <div style="color: #00ffff; font-weight: 600;">QR Code Generator</div>
    </div>
    
    <div class="header">
      <h1>📱 QR Code Generator</h1>
      <p style="color: #a0d4ff;">Create and download QR codes instantly</p>
    </div>
    
    <div class="generator-box">
      <div class="input-group">
        <label class="label">Enter URL or Text</label>
        <input type="text" id="textInput" placeholder="https://example.com or any text...">
      </div>
      
      <div class="buttons">
        <button class="btn" onclick="generateQR()">✨ Generate QR Code</button>
        <button class="btn" onclick="downloadQR()" style="background: rgba(0, 255, 255, 0.2); color: #00ffff; border: 1px solid rgba(0, 255, 255, 0.3);">⬇️ Download</button>
      </div>
      
      <div id="qrcodeContainer"></div>
    </div>
  </div>
  
  <script>
    function generateQR() {
      const text = document.getElementById('textInput').value;
      if (!text) {
        alert('Please enter text or URL');
        return;
      }
      
      document.getElementById('qrcodeContainer').innerHTML = '';
      new QRCode(document.getElementById('qrcodeContainer'), {
        text: text,
        width: 300,
        height: 300,
        colorDark: '#000000',
        colorLight: '#ffffff'
      });
    }
    
    function downloadQR() {
      const canvas = document.querySelector('#qrcodeContainer canvas');
      if (!canvas) {
        alert('Generate a QR code first');
        return;
      }
      const link = document.createElement('a');
      link.href = canvas.toDataURL();
      link.download = 'qrcode.png';
      link.click();
    }
  </script>
</body>
</html>
