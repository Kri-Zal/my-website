<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free Unit Converter - Convert between metric, imperial, temperature, and more units instantly.">
  <title>Unit Converter - Temperature, Length, Weight & More</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #0f0f1e 0%, #1a0033 50%, #0f0f1e 100%);
      font-family: 'Space Grotesk', sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 15px 20px;
      background: rgba(0, 255, 255, 0.05);
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 255, 0.1);
    }
    
    .logo {
      font-size: 1.5rem;
      color: #00ffff;
      text-decoration: none;
      font-weight: 700;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .header h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #00ffff, #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    
    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 30px;
    }
    
    .category-btn {
      padding: 12px 20px;
      background: rgba(0, 255, 255, 0.1);
      border: 1px solid rgba(0, 255, 255, 0.2);
      color: #00ffff;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }
    
    .category-btn.active {
      background: rgba(0, 255, 255, 0.3);
      border-color: #00ffff;
    }
    
    .converter-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 255, 0.15);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 20px;
    }
    
    .converter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .input-group {
      display: flex;
      flex-direction: column;
    }
    
    .label {
      color: #00ffff;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    
    .input-wrapper {
      display: flex;
      gap: 10px;
    }
    
    input[type="number"] {
      flex: 1;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 6px;
      color: #00ffff;
      font-size: 1rem;
    }
    
    input[type="number"]:focus {
      outline: none;
      border-color: #00ffff;
    }
    
    select {
      padding: 12px 10px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 6px;
      color: #00ffff;
      cursor: pointer;
      min-width: 100px;
    }
    
    @media (max-width: 768px) {
      .converter-row {
        grid-template-columns: 1fr;
      }
      
      .header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="index.html" class="logo">← Back Home</a>
      <div style="color: #00ffff; font-weight: 600;">Unit Converter</div>
    </div>
    
    <div class="header">
      <h1>🔄 Unit Converter</h1>
      <p style="color: #a0d4ff;">Convert between any units instantly</p>
    </div>
    
    <div class="categories" id="categories"></div>
    
    <div class="converter-box" id="converterBox"></div>
  </div>
  
  <script>
    const conversions = {
      length: {
        name: 'Length',
        units: ['Meter', 'Kilometer', 'Centimeter', 'Millimeter', 'Mile', 'Yard', 'Foot', 'Inch'],
        factors: [1, 1000, 0.01, 0.001, 1609.34, 0.9144, 0.3048, 0.0254]
      },
      weight: {
        name: 'Weight',
        units: ['Kilogram', 'Gram', 'Milligram', 'Pound', 'Ounce', 'Ton'],
        factors: [1, 0.001, 0.000001, 0.453592, 0.0283495, 1000]
      },
      temperature: {
        name: 'Temperature',
        units: ['Celsius', 'Fahrenheit', 'Kelvin'],
        custom: true
      },
      volume: {
        name: 'Volume',
        units: ['Liter', 'Milliliter', 'Gallon', 'Quart', 'Pint', 'Cup'],
        factors: [1, 0.001, 3.78541, 0.946353, 0.473176, 0.236588]
      }
    };
    
    let currentCategory = 'length';
    
    function initCategories() {
      const container = document.getElementById('categories');
      Object.keys(conversions).forEach(key => {
        const btn = document.createElement('button');
        btn.textContent = conversions[key].name;
        btn.className = 'category-btn' + (key === currentCategory ? ' active' : '');
        btn.onclick = () => selectCategory(key);
        container.appendChild(btn);
      });
    }
    
    function selectCategory(category) {
      currentCategory = category;
      document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderConverter();
    }
    
    function renderConverter() {
      const category = conversions[currentCategory];
      const box = document.getElementById('converterBox');
      
      let html = '<div class="converter-row">';
      html += '<div class="input-group">';
      html += '<label class="label">From</label>';
      html += '<div class="input-wrapper">';
      html += '<input type="number" id="input1" placeholder="0" oninput="convert()">';
      html += '<select id="select1" onchange="convert()">';
      category.units.forEach(u => html += `<option>${u}</option>`);
      html += '</select></div></div>';
      
      html += '<div class="input-group">';
      html += '<label class="label">To</label>';
      html += '<div class="input-wrapper">';
      html += '<input type="number" id="input2" readonly>';
      html += '<select id="select2">';
      category.units.forEach((u, i) => html += `<option ${i === 1 ? 'selected' : ''}>${u}</option>`);
      html += '</select></div></div></div>';
      
      box.innerHTML = html;
    }
    
    function convert() {
      const category = conversions[currentCategory];
      const value = parseFloat(document.getElementById('input1').value) || 0;
      const fromUnit = document.getElementById('select1').value;
      const toUnit = document.getElementById('select2').value;
      
      let result;
      if (category.custom) {
        result = convertTemperature(value, fromUnit, toUnit);
      } else {
        const fromFactor = category.factors[category.units.indexOf(fromUnit)];
        const toFactor = category.factors[category.units.indexOf(toUnit)];
        result = (value * fromFactor) / toFactor;
      }
      
      document.getElementById('input2').value = result.toFixed(4);
    }
    
    function convertTemperature(value, from, to) {
      let celsius;
      if (from === 'Celsius') celsius = value;
      else if (from === 'Fahrenheit') celsius = (value - 32) * 5/9;
      else celsius = value - 273.15;
      
      if (to === 'Celsius') return celsius;
      else if (to === 'Fahrenheit') return celsius * 9/5 + 32;
      else return celsius + 273.15;
    }
    
    initCategories();
    renderConverter();
  </script>
</body>
</html>
